<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项列表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📝 待办事项</h1>
    
    <div class="input-section">
      <input type="text" id="todo-input" placeholder="输入新任务..." autocomplete="off">
      <button id="add-btn">添加</button>
    </div>
    
    <div class="filters">
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="active">进行中</button>
      <button class="filter-btn" data-filter="completed">已完成</button>
    </div>
    
    <ul id="todo-list" class="todo-list">
      <!-- 任务项将通过 JavaScript 动态添加 -->
    </ul>
    
    <div class="stats">
      <span id="items-left">0 项待完成</span>
      <button id="clear-completed">清除已完成</button>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
